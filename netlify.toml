# Netlify-Konfiguration für den HiWo-med Website-Prototyp.
#
# Zwei Wege führen zum selben Ergebnis:
#  1. Repository in Netlify verbinden – dann greift dieser Build-Block.
#  2. Den Ordner "out" (bzw. das fertige ZIP) auf netlify.com/drop ziehen –
#     dann wird nur der [[headers]]-Teil aus der mitgelieferten Datei genutzt.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Vorab optimierte Assets ändern sich nur mit neuem Dateinamen und dürfen
# deshalb dauerhaft im Cache liegen.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/team/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML immer frisch ausliefern, damit Korrekturen sofort sichtbar sind.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Grundlegende Sicherheits-Header. Der Prototyp lädt ausschließlich eigene
# Dateien – keine externen Skripte, Schriften, Karten oder Tracker.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Der Entwurf soll nicht in Suchergebnissen auftauchen, solange er nur
    # zur internen Abstimmung online ist. Vor einem echten Livegang
    # entfernen – zusammen mit robots.ts und robots.index in layout.tsx.
    X-Robots-Tag = "noindex, nofollow"
