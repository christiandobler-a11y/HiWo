# Netlify-Konfiguration für den HiWo-med Website-Prototyp.
#
# Zwei Wege führen zum selben Ergebnis:
#  1. Repository in Netlify verbinden – dann greift dieser Build-Block.
#  2. Den Ordner "out" (bzw. das fertige ZIP) auf netlify.com/drop ziehen –
#     dann wird nur der [[headers]]-Teil aus der mitgelieferten Datei genutzt.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Vorab optimierte Assets ändern sich nur mit neuem Dateinamen und dürfen
# deshalb dauerhaft im Cache liegen.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

## Wichtig: nur auf die Bilddateien beschränken (".webp"), nicht auf "/team/*"
## allgemein – sonst trifft die Regel auch die Team-SEITE ("/team/") und ihre
## Navigations-Payload ("/team/index.txt", wird bei Klicks auf "Team" im Menü
## nachgeladen). Beide würden dann fälschlich ein Jahr lang unveränderlich im
## Browser-Cache hängen bleiben – nach jedem Redeploy zeigt der Browser dann
## eine alte Seite, deren referenzierte JS/CSS-Dateien (neue Hash-Namen bei
## jedem Build) nicht mehr existieren: Seite lädt nur noch Text, keine Bilder.
[[headers]]
  for = "/team/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML immer frisch ausliefern, damit Korrekturen sofort sichtbar sind.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Grundlegende Sicherheits-Header. Die Seite lädt ausschließlich eigene
# Dateien – keine externen Skripte, Schriften, Karten oder Tracker.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Weiterleitungen von den alten hiwomed.de/de/*.html-Adressen auf die neuen
# Pfade -- alte, bereits bei Google indexierte Links (z. B. aus Suchergebnissen
# oder Lesezeichen) sollen nicht ins Leere laufen. Reihenfolge wichtig: Netlify
# nimmt die erste passende Regel, darum stehen die konkreten Pfade vor dem
# Catch-all für alles verbleibende unter /de/*.
[[redirects]]
  from = "/de/"
  to = "/"
  status = 301

[[redirects]]
  from = "/de/home.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/de/leistungen.html"
  to = "/leistungen/"
  status = 301

[[redirects]]
  from = "/de/sortiment.html"
  to = "/leistungen/"
  status = 301

[[redirects]]
  from = "/de/seminare.html"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/de/kontakt.html"
  to = "/kontakt/"
  status = 301

[[redirects]]
  from = "/de/team.html"
  to = "/team/"
  status = 301

[[redirects]]
  from = "/de/karriere.html"
  to = "/karriere/"
  status = 301

[[redirects]]
  from = "/de/unser-anspruch.html"
  to = "/unternehmen/"
  status = 301

[[redirects]]
  from = "/de/unsere-kunden.html"
  to = "/unternehmen/"
  status = 301

[[redirects]]
  from = "/de/impressum-agbs.html"
  to = "/impressum/"
  status = 301

[[redirects]]
  from = "/de/datenschutz.html"
  to = "/datenschutz/"
  status = 301

[[redirects]]
  from = "/de/sitemap.html"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/de/*"
  to = "/"
  status = 301
